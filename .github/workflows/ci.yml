name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  mod:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --release -- -D warnings
        working-directory: mod
      - run: cargo build --release
        working-directory: mod
      - uses: actions/upload-artifact@v4
        with:
          name: elden-live-map
          path: mod/target/release/elden_live_map.dll
